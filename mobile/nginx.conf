server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Same-origin API routing: each /api/v1/* prefix maps to the owning
    # microservice (K8s Service DNS = Helm release name, same namespace).
    location /api/v1/auth/ {
        proxy_pass http://auth-service:8081;
    }

    location /api/v1/users/ {
        proxy_pass http://auth-service:8081;
    }

    location /api/v1/identities/ {
        proxy_pass http://identity-service:8082;
    }

    location /api/v1/gate/ {
        proxy_pass http://gateway-service:8083;
    }

    location ~ ^/api/v1/(surveys|questionnaires|attachments) {
        proxy_pass http://form-service:8084;
    }

    location ~ ^/api/v1/(circles|buildings|floors|access-points|encounters|health|mesh|location|sessions|admin) {
        proxy_pass http://promotion-service:8086;
    }

    location /api/v1/analytics/ {
        proxy_pass http://dashboard-service:8087;
    }

    location /api/v1/files/ {
        proxy_pass http://file-service:8088;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
