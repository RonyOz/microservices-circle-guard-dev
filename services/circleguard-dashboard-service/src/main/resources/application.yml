spring:
  application:
    name: circleguard-dashboard-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:circleguard_dashboard}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8087

circleguard:
  promotion-service:
    url: ${PROMOTION_SERVICE_URL:http://localhost:8083}
