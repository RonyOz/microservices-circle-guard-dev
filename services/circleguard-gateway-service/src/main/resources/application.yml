spring:
  application:
    name: circleguard-gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

jwt:
  secret: "${JWT_SECRET:my-super-secret-dev-key-32-chars-long-12345678}"
  expiration: 3600000

qr:
  secret: "${QR_SECRET:my-qr-secret-key-for-dev-1234567890}"
  expiration: ${QR_EXPIRATION_SECONDS:300}

# Rate Limiting — values injected via K8s ConfigMap (External Configuration Store pattern)
rate:
  limit:
    requests-per-window: ${RATE_LIMIT_REQUESTS_PER_WINDOW:60}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

server:
  port: 8083

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,metrics
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://jaeger:9411/api/v2/spans