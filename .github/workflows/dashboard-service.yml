name: CI — dashboard-service

on:
  push:
    branches: [main, dev, release/**]
    paths:
      - services/circleguard-dashboard-service/**
      - build.gradle.kts
  pull_request:
    paths:
      - services/circleguard-dashboard-service/**
      - build.gradle.kts
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/_reusable-service-ci.yml
    with:
      service: dashboard-service
      build_system: gradle
      context: .
      dockerfile: services/circleguard-dashboard-service/Dockerfile
    secrets: inherit
