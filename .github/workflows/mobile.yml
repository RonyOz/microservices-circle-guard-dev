name: CI — mobile

on:
  push:
    branches: [main, dev, release/**]
    paths: [mobile/**]
  pull_request:
    paths: [mobile/**]

jobs:
  ci:
    uses: ./.github/workflows/_reusable-service-ci.yml
    with:
      service: mobile
      build_system: npm
      context: mobile
      dockerfile: mobile/Dockerfile
    secrets: inherit
