name: Reusable Service CI

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      build_system:
        required: true
        type: string
        description: '"gradle" or "npm"'
      context:
        required: false
        type: string
        default: "."
      dockerfile:
        required: false
        type: string
        default: "Dockerfile"

env:
  AWS_REGION: us-east-1
  REPOSITORY: circleguard

permissions:
  id-token: write
  contents: read

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials via OIDC
        id: aws-auth
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: vars
        run: echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Detect version (main only)
        id: version
        if: ${{ github.ref_name == 'main' }}
        run: |
          TAG=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo '1.0.0')
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Test (Gradle)
        if: ${{ inputs.build_system == 'gradle' }}
        run: |
          ./gradlew :services:circleguard-${{ inputs.service }}:test \
                    :services:circleguard-${{ inputs.service }}:jacocoTestReport \
                    --no-daemon --parallel

      - name: Export dependency classpath for Sonar
        if: ${{ inputs.build_system == 'gradle' }}
        run: ./gradlew :services:circleguard-${{ inputs.service }}:sonarLibraries --no-daemon

      - name: SonarQube analysis (Java)
        if: ${{ inputs.build_system == 'gradle' }}
        continue-on-error: true
        uses: sonarsource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: services/circleguard-${{ inputs.service }}
          args: >
            -Dsonar.projectKey=circleguard-${{ inputs.service }}
            -Dsonar.projectName=circleguard-${{ inputs.service }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=src/main/java
            -Dsonar.java.binaries=build/classes/java/main
            -Dsonar.java.libraries=build/sonar-libs/*.jar
            -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
            -Dsonar.qualitygate.wait=true

      - name: Test (npm)
        if: ${{ inputs.build_system == 'npm' }}
        run: |
          npm ci
          npm test -- --coverage
        working-directory: ${{ inputs.context }}

      - name: SonarQube analysis (JS/TS)
        if: ${{ inputs.build_system == 'npm' }}
        continue-on-error: true
        uses: sonarsource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ inputs.context }}
          args: >
            -Dsonar.projectKey=circleguard-${{ inputs.service }}
            -Dsonar.projectName=circleguard-${{ inputs.service }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=.
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true

      # Push + deploy on push or workflow_dispatch; pull_request runs tests only.
      - name: Build and push Docker image
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.REPOSITORY }}:${{ inputs.service }}-sha-${{ steps.vars.outputs.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.REPOSITORY }}:${{ inputs.service }}-buildcache
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.REPOSITORY }}:${{ inputs.service }}-buildcache
          cache-to: type=inline

      - name: Trivy vulnerability scan
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.REPOSITORY }}:${{ inputs.service }}-sha-${{ steps.vars.outputs.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload Trivy scan results
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ inputs.service }}-${{ github.run_id }}
          path: trivy-results.sarif
          if-no-files-found: ignore

      - name: Trigger ops deployment
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.OPS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          repository: RonyOz/microservices-circle-guard-ops
          event-type: ${{ github.ref_name == 'main' && 'deploy-prod' || (startsWith(github.ref_name, 'release/') && 'deploy-stage' || 'deploy-dev') }}
          client-payload: |
            {
              "service": "${{ inputs.service }}",
              "image_tag": "sha-${{ steps.vars.outputs.sha }}",
              "git_commit": "${{ github.sha }}",
              "version": "${{ steps.version.outputs.version }}",
              "registry_url": "${{ steps.login-ecr.outputs.registry }}"
            }
