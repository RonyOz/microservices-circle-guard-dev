name: CI — file-service

on:
  push:
    branches: [main, dev, release/**]
    paths: [services/circleguard-file-service/**]
  pull_request:
    paths: [services/circleguard-file-service/**]

jobs:
  ci:
    uses: ./.github/workflows/_reusable-service-ci.yml
    with:
      service: file-service
      build_system: gradle
      context: .
      dockerfile: services/circleguard-file-service/Dockerfile
    secrets: inherit
