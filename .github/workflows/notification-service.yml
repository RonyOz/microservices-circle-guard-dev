name: CI — notification-service

on:
  push:
    branches: [main, dev, release/**]
    paths: [services/circleguard-notification-service/**]
  pull_request:
    paths: [services/circleguard-notification-service/**]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/_reusable-service-ci.yml
    with:
      service: notification-service
      build_system: gradle
      context: .
      dockerfile: services/circleguard-notification-service/Dockerfile
    secrets: inherit
